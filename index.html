<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도리택스 수집 현황</title>
<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#1f1f1d;--mut:#6f6e69;--card:#f1efe9;--line:#dedbd2;--ok:#3b6d11;--run:#185fa5;--wait:#8a8880;--err:#a32d2d;--bar:#185fa5;--bar2:#3b6d11}
@media(prefers-color-scheme:dark){:root{--bg:#1b1b19;--fg:#ecebe6;--mut:#a3a29c;--card:#262624;--line:#3a3a37;--ok:#97c459;--run:#85b7eb;--err:#f09595;--bar:#85b7eb;--bar2:#97c459}}
*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);font:14px/1.6 'Malgun Gothic',system-ui,sans-serif;margin:0;padding:20px 16px}
main{max-width:820px;margin:0 auto}h1{font-size:20px;font-weight:600;margin:0 0 2px}h2{font-size:15px;font-weight:600;margin:22px 0 8px}
.m{color:var(--mut);font-size:13px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.c{background:var(--card);border-radius:10px;padding:12px 14px}.c b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.st{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.nm{font-weight:600}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.ok{color:var(--ok)}.run{color:var(--run)}.wait{color:var(--wait)}.err{color:var(--err)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--bar)}.bar i.done{background:var(--bar2)}
.num{font-variant-numeric:tabular-nums}
</style></head><body><main>
<h1>도리택스 빠진 자료 수집</h1>
<div class="m" id="sub">불러오는 중…</div>
<div class="g" id="cards"></div>
<h2>단계별 진행</h2><div id="steps"></div>
<p class="m">사무실 PC가 1분마다 올리고, 이 화면은 30초마다 다시 읽습니다(깃허브 캐시로 최대 5분 늦을 수 있음).</p>
</main>
<script>
const URL_="https://raw.githubusercontent.com/doridoritax/dori-progress/data/status.json";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag={done:'<span class="tag ok">완료</span>',run:'<span class="tag run">진행 중</span>',wait:'<span class="tag wait">대기</span>'};
function bar(d,t,l){if(!t)return '<div class="m">'+esc(l||"목록 받기 전")+'</div>';const p=Math.min(100,d*100/t);
 return `<div class="bar"><i class="${d>=t?"done":""}" style="width:${p.toFixed(1)}%"></i></div><div class="row m num"><span>${d.toLocaleString()} / ${t.toLocaleString()} ${esc(l)}</span><span>${p.toFixed(0)}%</span></div>`}
async function load(){
 try{const r=await fetch(URL_+"?t="+Date.now(),{cache:"no-store"});const s=await r.json();
  const age=Math.round((Date.now()-new Date(s.at).getTime())/60000);
  document.getElementById("sub").textContent=`시작 ${s.started} · 사무실 PC 기준 ${s.at.replace("T"," ").slice(0,19)} (${age}분 전) · 화면 확인 ${new Date().toLocaleTimeString("ko-KR")}`;
  const cls=s.state==="완료"?"ok":s.state==="진행 중"?"run":"err";
  document.getElementById("cards").innerHTML=[["상태",`<b class="${cls}">${esc(s.state)}</b>`],["지금 단계",`<b style="font-size:15px">${esc(s.step)}</b>`],
   ["받는 속도(최근 10분)",`<b class="num">${s.rate.toFixed(1)}<span class="m"> 건/분</span></b>`],["남은 시간(추정)",`<b class="num" style="font-size:18px">${esc(s.eta)}</b>`],
   ["DB 문서 전체",`<b class="num">${s.docs.toLocaleString()}</b>`]].map(([k,v])=>`<div class="c"><span class="m">${k}</span>${v}</div>`).join("");
  document.getElementById("steps").innerHTML=s.stages.map(x=>`<div class="st"><div class="row"><span class="nm">${esc(x.name)}</span>${tag[x.state]}</div>${bar(x.done,x.total,x.unit)}${x.note?'<div class="m num">'+esc(x.note)+'</div>':""}</div>`).join("");
 }catch(e){document.getElementById("sub").textContent="현황을 아직 못 읽었습니다: "+e}}
load();setInterval(load,30000);
</script></body></html>
